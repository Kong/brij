# NPM publish: uses npm Trusted Publishing (OIDC). No NPM_TOKEN secret required.
# Requires npm >= 11.5.1 and the `id-token: write` permission on the publish job.
name: CI
on:
  push:
    branches: [ main ]
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@24cb9080177205b6e8c946b17badbe402adc938f
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@bea5baf987ba7aa777a8a0b4ace377a21c45c381
        with:
          node-version: ${{ matrix.node-version }}
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: yarn test

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Generate kong bot app token
        id: app-token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
        with:
          app-id: ${{ vars.KONG_GH_APP_ID_PUBLIC }}
          private-key:  ${{ secrets.KONG_GH_APP_PRIVATE_KEY_PUBLIC }}
          owner: Kong
      - name: Checkout Source Code
        uses: actions/checkout@24cb9080177205b6e8c946b17badbe402adc938f
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Use Node.js 22.x
        uses: actions/setup-node@bea5baf987ba7aa777a8a0b4ace377a21c45c381
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - name: Upgrade npm for Trusted Publishing (OIDC)
        run: npm install -g npm@^11.5.1
      - name: Verify npm version
        run: npm --version
      - run: yarn install --frozen-lockfile
      - name: Bump patch version
        run: npm version patch --no-git-tag-version
      - run: yarn build
      - run: yarn bundle:cli
      - name: Publish to npm
        run: npm publish --access restricted --ignore-scripts
      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          VER=$(node -p "require('./package.json').version")
          git commit -m "chore: release v${VER} [skip ci]"
          git push origin HEAD:main
